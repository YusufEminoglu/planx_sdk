[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "planx-sdk"
version = "2.25.0"
authors = [
    { name = "Yusuf Eminoğlu", email = "yusufeminoglu@gmail.com" }
]
description = "Core spatial analytics, spatial statistics, and urban resilience engines for the PlanX ecosystem."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
keywords = [
    "gis",
    "spatial-analysis",
    "spatial-statistics",
    "urban-resilience",
    "accessibility",
    "space-syntax",
    "mcda",
    "geostats",
    "moran-i",
    "getis-ord",
    "e2sfca",
    "flood-simulation",
    "seismic-debris",
    "spacemate",
    "bpr",
    "urban-informatics",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
]
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
]

[project.urls]
Homepage = "https://github.com/YusufEminoglu/planx_sdk"
Documentation = "https://yusufeminoglu.github.io/planx_sdk/"
Repository = "https://github.com/YusufEminoglu/planx_sdk"
Issues = "https://github.com/YusufEminoglu/planx_sdk/issues"
Changelog = "https://github.com/YusufEminoglu/planx_sdk/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
planx = ["py.typed"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [
    "scratch",
    ".venv",
    "build",
    "dist",
    "tests/run_engine_tests.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4"]
ignore = []

[tool.mypy]
files = ["src"]

[[tool.mypy.overrides]]
# scipy and scikit-learn do not ship type stubs; treat them as untyped.
module = ["scipy.*", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["planx"]
branch = true

[tool.coverage.report]
show_missing = true
# Keep meaningful headroom below the current ~90% branch coverage.
fail_under = 85
